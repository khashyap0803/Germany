<title>Road to Germany 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab-notebook tool — sticky header with today's status and a focus timer, tabbed views below, one column on phones. */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#0e6b5c; --accent-soft:#d6ece6; --warn:#b4610f; --bad:#b3261e; --done:#2f7d46; --track:#e7ece9; --skip:#8f9a96;
  --k-c:#2f5fb3; --k-elec:#b4610f; --k-course:#6a4bb0; --k-proj:#0e6b5c; --k-read:#5d6b66;
  --k-eng:#a63a64; --k-ielts:#c0392b; --k-ger:#8a6d00; --k-adm:#455a64; --k-app:#1d5f8a; --k-mile:#7a1f8f; --k-track:#5d6b66; --k-rest:#8f9a96;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#16201d; --ink:#e6eeea; --muted:#9aaba4; --line:#2a3833;
  --accent:#4cc2a8; --accent-soft:#163a33; --warn:#f0a35a; --bad:#ff8a7a; --done:#6fcf8a; --track:#22302b; --skip:#6b7a75;
  --k-c:#7aa2f0; --k-elec:#f0a35a; --k-course:#b49cf0; --k-proj:#4cc2a8; --k-read:#9aaba4;
  --k-eng:#ef7fae; --k-ielts:#ff8a7a; --k-ger:#e3c55a; --k-adm:#9fb4bf; --k-app:#73b8e6; --k-mile:#d78cf0; --k-track:#9aaba4; --k-rest:#6b7a75;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#16201d; --ink:#e6eeea; --muted:#9aaba4; --line:#2a3833;
  --accent:#4cc2a8; --accent-soft:#163a33; --warn:#f0a35a; --bad:#ff8a7a; --done:#6fcf8a; --track:#22302b; --skip:#6b7a75;
  --k-c:#7aa2f0; --k-elec:#f0a35a; --k-course:#b49cf0; --k-proj:#4cc2a8; --k-read:#9aaba4;
  --k-eng:#ef7fae; --k-ielts:#ff8a7a; --k-ger:#e3c55a; --k-adm:#9fb4bf; --k-app:#73b8e6; --k-mile:#d78cf0; --k-track:#9aaba4; --k-rest:#6b7a75;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.toprow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
h3.sec{font-family:var(--display);font-weight:600;font-size:17px;margin:24px 0 8px}
.sub{color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{font-weight:600}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent)}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:600 14px var(--body);background:none;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{margin-top:12px;padding:8px 12px;border:1px solid var(--warn);color:var(--warn);border-radius:6px;font-size:13px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:14px}
.timer .clock{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.timer .what{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
section.view{margin-top:20px}
@media (max-width:600px){header.top{position:static}}
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.daynav h2{margin-right:8px;min-width:0}
.btn{font:600 13px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:2px 6px;font-size:12px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
input[type=date],input[type=text],input[type=search],select{font:14px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=date]{font:13px var(--mono)}
.phasepill{font:600 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.meta{color:var(--muted);font-size:13px;margin:6px 0 14px}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.tasks li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--kc,var(--line));border-radius:6px;padding:10px 12px}
ul.tasks li.done{opacity:.6}
ul.tasks li.done .tt{text-decoration:line-through}
ul.tasks li.skipped{opacity:.55;border-left-style:dashed}
ul.tasks li.skipped .tt{color:var(--muted)}
ul.tasks input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--done)}
.tt{min-width:0;overflow-wrap:anywhere}
.tt code,.how code{font-family:var(--mono);font-size:.9em}
.how{grid-column:2/4;color:var(--muted);font-size:13px}
.acts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px}
.chip{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--kc);white-space:nowrap}
.chip.sk{color:var(--skip);margin-left:6px}
.mins{display:block;color:var(--muted);font:12px var(--mono);text-align:right}
textarea{width:100%;min-height:80px;font:14px var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px;resize:vertical}
label.small{font-size:13px;color:var(--muted);display:block;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
details.card summary{cursor:pointer;font-weight:700}
.upnext{display:grid;gap:4px;font-size:14px;margin-top:8px}
.upnext div{display:flex;gap:10px}
.upnext .n{font:600 13px var(--mono);color:var(--accent);flex:none;width:64px;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-top:16px;align-items:start}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.wday.today{border-color:var(--accent)}
.wday h3{font:600 13px var(--mono);margin:0 0 6px;cursor:pointer}
.mini{display:flex;gap:6px;align-items:start;font-size:12px;margin-top:6px}
.mini input{margin-top:2px;flex:none;accent-color:var(--done)}
.mini span{min-width:0;overflow-wrap:anywhere}
.mini.done span,.mini.skipped span{text-decoration:line-through;color:var(--muted)}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.review{display:grid;gap:8px;margin-top:8px}
.review .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:600 13px var(--mono);background:var(--panel);color:var(--muted);border:0;border-right:1px solid var(--line);padding:6px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.months{display:grid;gap:24px}
.cal h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:11px var(--mono);color:var(--muted);text-align:center}
.cell{aspect-ratio:1/1;max-width:100%;border-radius:5px;border:1px solid var(--line);background:var(--panel);font:12px var(--mono);display:flex;flex-direction:column;justify-content:space-between;padding:4px;cursor:pointer;color:var(--ink);text-align:left;position:relative;overflow:hidden}
.cell .fill{position:absolute;left:0;bottom:0;right:0;background:var(--done);opacity:.28}
.cell.today{outline:2px solid var(--accent)}
.cell.mile::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--k-mile)}
.cell.note::before{content:"";position:absolute;bottom:4px;right:4px;width:6px;height:6px;border-radius:1px;background:var(--warn)}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.phases{display:grid;gap:12px}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.phase.now{border-color:var(--accent)}
.phase h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.phase .when{font:12px var(--mono);color:var(--muted)}
.ms{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:13px}
.ms li{display:flex;gap:8px}
.ms .d{font-family:var(--mono);color:var(--muted);flex:none;width:88px}
.ms li.done{color:var(--muted);text-decoration:line-through}
.courses{display:grid;gap:10px}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.course .n{font-weight:700;min-width:0}
.course .c{font:12px var(--mono);text-align:right;color:var(--muted)}
.course .bar{grid-column:1/3;margin-top:0}
.course .span{grid-column:1/3;font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.course.behind{border-color:var(--warn)}
.course .lag{color:var(--warn)}
.chart{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;align-items:end;height:160px;margin-top:8px;border-bottom:1px solid var(--line)}
.chart .col{position:relative;height:100%}
.chart .pl{position:absolute;bottom:0;left:15%;right:15%;background:var(--track);border-radius:3px 3px 0 0}
.chart .dn{position:absolute;bottom:0;left:15%;right:15%;background:var(--accent);border-radius:3px 3px 0 0}
.chart .col.cur .pl{outline:1px dashed var(--accent)}
.xlab{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;font:10px var(--mono);color:var(--muted);text-align:center;margin-top:4px;overflow:hidden}
table.kinds{width:100%;border-collapse:collapse;font-size:14px}
table.kinds td,table.kinds th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.kinds td.r,table.kinds th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:600 28px var(--mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.words{display:grid;gap:6px;margin-top:8px}
.word{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
.word .w{font-weight:700;overflow-wrap:anywhere}
.word .h{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.word .sc{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px;margin-top:10px}
@media (max-width:560px){.addrow{grid-template-columns:1fr}}
.quiz{margin-top:12px}
.quiz .prompt{font-size:18px;margin:8px 0}
.quiz input{width:100%;font:600 20px var(--mono);padding:10px}
.res-ok{color:var(--done);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
.hits{display:grid;gap:6px;margin-top:12px}
.hit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--ink);font:14px var(--body)}
.hit .d{font:12px var(--mono);color:var(--muted)}
.hit mark{background:var(--accent-soft);color:inherit}
.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:6px;text-align:center}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;z-index:9;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:1px solid var(--bg);color:var(--bg);border-radius:4px;padding:2px 8px;cursor:pointer;font:600 13px var(--body)}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>

<div class="wrap">
<header class="top">
  <div class="toprow">
    <div>
      <h1>Road to Germany 2028</h1>
      <div class="sub" id="subline">Day-by-day plan · Oct 5, 2026 → Oct 1, 2028</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="overallbar" style="width:0%"></i></div>
  <div class="timer" id="timer" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-v="today" aria-selected="true">Day</button>
    <button role="tab" data-v="week" aria-selected="false">Week</button>
    <button role="tab" data-v="month" aria-selected="false">Calendar</button>
    <button role="tab" data-v="stats" aria-selected="false">Stats</button>
    <button role="tab" data-v="phases" aria-selected="false">Milestones</button>
    <button role="tab" data-v="courses" aria-selected="false">Courses</button>
    <button role="tab" data-v="words" aria-selected="false">Word lists</button>
    <button role="tab" data-v="find" aria-selected="false">Find</button>
  </nav>
  <div class="banner" id="banner" hidden></div>
</header>

<section class="view" id="v-today"></section>
<section class="view" id="v-week" hidden></section>
<section class="view" id="v-month" hidden></section>
<section class="view" id="v-stats" hidden></section>
<section class="view" id="v-phases" hidden></section>
<section class="view" id="v-courses" hidden></section>
<section class="view" id="v-words" hidden></section>
<section class="view" id="v-find" hidden></section>
</div>
<div id="toastbox"></div>

<script id="plan" type="application/json">__PLAN__</script>
<script>
(function(){
const PLAN = JSON.parse(document.getElementById('plan').textContent);
const DAYS = PLAN.days, BYDATE = {};
// Stable task ids: date + hash(kind|text), so regenerating the plan never moves a tick onto another task.
function h32(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
DAYS.forEach((d,i)=>{ d.i=i; BYDATE[d.d]=d; const seen={}; d.t.forEach(t=>{ const b=h32(t.k+"|"+t.t); seen[b]=(seen[b]||0)+1; t.id=d.d+"#"+b+(seen[b]>1?"-"+seen[b]:""); }); });
const TASK = {}; DAYS.forEach(d=>d.t.forEach(t=>TASK[t.id]=t));
const KIND = {c:"C",elec:"Electronics",course:"Course",proj:"Project",read:"Reading",eng:"English",ielts:"IELTS",ger:"German",adm:"Admin",app:"Application",mile:"Milestone",track:"Tracking",rest:"Rest"};
const FIRST = DAYS[0].d, LAST = DAYS[DAYS.length-1].d;
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const clamp = s => s<FIRST?FIRST:(s>LAST?LAST:s);
const REAL_TODAY = iso(new Date());
const TODAY = clamp(REAL_TODAY);
const fmt = (s,o) => parse(s).toLocaleDateString(undefined,o||{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const escT = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const esc = s => escT(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const actionable = t => t.k!=="rest";
const hm = m => m>=60? Math.floor(m/60)+"h"+(m%60?String(m%60).padStart(2,"0"):"") : m+"m";

// ---------------- state. db docs: months/YYYY-MM {done:{id:true|"s"}, notes:{date:text}} · weeks/<monday> {energy,good,change} · lists/<en|de> {words:[]}
const state = {}; const weeks = {}; const lists = {en:{words:[]}, de:{words:[]}};
const month = s => s.slice(0,7);
const get = m => state[m] || (state[m] = {done:{}, notes:{}});
let db = null, mode = "local", timer = null, writing = false;
const pending = new Set();
function loadLocal(){ try{ const raw = localStorage.getItem("rtg2028"); if(raw){ const o=JSON.parse(raw); if(o.months){ Object.assign(state,o.months); Object.assign(weeks,o.weeks||{}); Object.assign(lists,o.lists||{}); } else Object.assign(state,o); } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("rtg2028", JSON.stringify({months:state,weeks,lists})); }catch(e){} }
const EMPTY = {done:{}, notes:{}};
const peek = m => state[m] || EMPTY; // read without creating empty month docs
const status = t => peek(month(t.id)).done[t.id];
const isDone = t => status(t)===true;
const isHandled = t => !!status(t);
function setStatus(t,v){ const m=get(month(t.id)); if(v) m.done[t.id]=v; else delete m.done[t.id]; queue("months/"+month(t.id)); }
function setNote(d,v){ const m=get(month(d)); if(v) m.notes[d]=v; else delete m.notes[d]; queue("months/"+month(d)); }
function bodyOf(path){ const [c,id]=path.split("/"); if(c==="months") return {done:get(id).done, notes:get(id).notes}; if(c==="weeks") return weeks[id]||{}; return lists[id]||{words:[]}; }
function queue(path){ pending.add(path); saveLocal(); clearTimeout(timer); timer=setTimeout(flush, 700); renderStats(); }
async function write(path){ await db.doc(path).set(JSON.parse(JSON.stringify(bodyOf(path)))); }
async function flush(){
  if(!db) return;
  if(writing){ clearTimeout(timer); timer=setTimeout(flush,400); return; }
  writing = true;
  try{
    while(pending.size){
      const path = pending.values().next().value; pending.delete(path);
      try{ await write(path); }
      catch(e){
        let err=e;
        if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await write(path); continue; }catch(e2){ err=e2; } }
        showBanner("Couldn't save to your tracker right now ("+(err&&err.code||"error")+"). Your changes are kept in this browser and will save on your next change.");
      }
    }
  } finally { writing = false; }
}
function showBanner(t){ const b=document.getElementById("banner"); b.textContent=t; b.hidden=!t; }
let toastT;
function toast(msg, undo){
  const box=document.getElementById("toastbox"); clearTimeout(toastT);
  box.innerHTML=`<div class="toast" role="status"><span>${escT(msg)}</span>${undo?'<button id="undo">Undo</button>':""}</div>`;
  if(undo) box.querySelector("#undo").onclick=()=>{ undo(); box.innerHTML=""; };
  toastT=setTimeout(()=>box.innerHTML="", 6000);
}
// Version 1 of this page keyed ticks by position ("2026-10-15#4"); convert them to stable ids.
function migrate(m){
  let changed=false; const s=get(m);
  for(const k of Object.keys(s.done)){ const mm=/^(\d{4}-\d{2}-\d{2})#(\d+)$/.exec(k); if(!mm) continue;
    const day=BYDATE[mm[1]], t=day&&day.t[+mm[2]]; if(t && !s.done[t.id]) s.done[t.id]=s.done[k]; delete s.done[k]; changed=true; }
  return changed;
}

// ---------------- stats
function dayStats(d){ const day=BYDATE[d]; if(!day) return {n:0,k:0,h:0,pm:0,dm:0}; let n=0,k=0,h=0,pm=0,dm=0; day.t.forEach(t=>{ if(actionable(t)){ n++; pm+=t.m; if(isDone(t)){k++;dm+=t.m;} if(isHandled(t)) h++; } }); return {n,k,h,pm,dm}; }
function phaseOf(d){ return PLAN.phases.find(p=>d>=p.from&&d<=p.to); }
function missed(days){ const out=[]; for(let d=addDays(TODAY,-days); d<TODAY; d=addDays(d,1)){ const day=BYDATE[d]; if(!day) continue; day.t.forEach(t=>{ if(actionable(t)&&t.m>0&&!isHandled(t)) out.push({d,t}); }); } return out; }
function streak(){
  let s=0; const t0=dayStats(TODAY); if(t0.n && t0.h===t0.n && t0.k>0) s=1;
  let d=addDays(TODAY,-1);
  while(d>=FIRST){ const st=dayStats(d); if(st.n===0){ d=addDays(d,-1); continue; } if(st.h===st.n && st.k>0){ s++; d=addDays(d,-1);} else break; }
  return s;
}
function renderStats(){
  let n=0,k=0,nAll=0,kAll=0;
  for(const day of DAYS){ const s=dayStats(day.d); nAll+=s.n; kAll+=s.k; if(day.d<=TODAY){ n+=s.n; k+=s.k; } }
  const until = target => diffDays(REAL_TODAY,target);
  const ph = phaseOf(TODAY);
  const items = [
    ["Phase", ph?ph.id:"—"],
    ["Done to date", n? Math.round(100*k/n)+"%":"—"],
    ["Whole plan", (Math.round(1000*kAll/nAll)/10)+"%"],
    ["Streak", streak()+" d"],
    ["Bond", until("2027-10-01")>=0? until("2027-10-01")+" d":"done"],
    ["IELTS", until("2027-10-09")>=0? until("2027-10-09")+" d":"done"],
    ["Fly", until("2028-09-28")>=0? until("2028-09-28")+" d":"✈"]
  ];
  document.getElementById("stats").innerHTML = items.map(([a,b])=>`<span>${a} <b>${escT(b)}</b></span>`).join("");
  document.getElementById("overallbar").style.width = (n?Math.round(100*k/n):0)+"%";

// ---------------- focus timer (in memory only)
const T = {task:null, left:0, run:false, iv:null};
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(o=>{ const g=a.createGain(), os=a.createOscillator(); os.frequency.value=880; os.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15,a.currentTime+o); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+o+.3); os.start(a.currentTime+o); os.stop(a.currentTime+o+.3); }); }catch(e){} }
function startTimer(t){ clearInterval(T.iv); T.task=t; T.left=Math.min(t.m,50)*60; T.run=true; T.iv=setInterval(tick,1000); drawTimer(); }
function tick(){ if(!T.run) return; T.left--; if(T.left<=0){ T.left=0; T.run=false; clearInterval(T.iv); beep(); } drawTimer(); }
function drawTimer(){
  const el=document.getElementById("timer");
  if(!T.task){ el.hidden=true; document.title="Road to Germany 2028"; return; } el.hidden=false;
  const mm=String(Math.floor(T.left/60)).padStart(2,"0"), ss=String(T.left%60).padStart(2,"0");
  const fin=T.left===0;
  el.innerHTML=`<span class="clock">${mm}:${ss}</span><span class="what">${fin?"Time's up — ":""}${esc(T.task.t)}</span>
    ${fin?`<button class="btn primary" id="tdone">Tick it ✓</button>`:`<button class="btn" id="tpause">${T.run?"Pause":"Resume"}</button><button class="btn" id="tplus">+5 min</button>`}
    <button class="btn" id="tstop">${fin?"Close":"Stop"}</button>`;
  const q=s=>el.querySelector(s);
  if(q("#tpause")) q("#tpause").onclick=()=>{ T.run=!T.run; clearInterval(T.iv); if(T.run) T.iv=setInterval(tick,1000); drawTimer(); };
  if(q("#tplus")) q("#tplus").onclick=()=>{ T.left+=300; drawTimer(); };
  if(q("#tdone")) q("#tdone").onclick=()=>{ setStatus(T.task,true); T.task=null; drawTimer(); render(); };
  q("#tstop").onclick=()=>{ clearInterval(T.iv); T.task=null; drawTimer(); };
  document.title = (T.run? mm+":"+ss+" · " : "") + "Road to Germany 2028";
}

    <h3 class="sec">${ws.length} words · weakest first</h3>
    <div class="words">${ws.length? ws.map((w,i)=>({w,i})).sort((a,b)=>((a.w.ok||0)-2*(a.w.bad||0))-((b.w.ok||0)-2*(b.w.bad||0))).map(({w,i})=>`<div class="word"><div><div class="w">${escT(w.w)}</div>${w.h?`<div class="h">${escT(w.h)}</div>`:""}</div><span class="sc">✓${w.ok||0} ✗${w.bad||0}</span><button class="btn ghost" data-del="${i}" aria-label="Delete ${escT(w.w)}">✕</button></div>`).join("") : `<div class="empty">No words yet. Add the first one above.</div>`}</div>`;
  el.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>{ wl=b.dataset.wl; quiz=null; renderWords(); });
  el.querySelector("#addf").onsubmit=e=>{ e.preventDefault(); const w=el.querySelector("#aw").value.trim(), h=el.querySelector("#ah").value.trim(); if(!w) return;
    if(ws.some(x=>x.w.toLowerCase()===w.toLowerCase())){ toast("Already in the list"); return; }
    lists[wl]={words:[...ws,{w,h,ok:0,bad:0,at:REAL_TODAY}]}; queue("lists/"+wl); renderWords(); document.getElementById("aw").focus(); };
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, which=wl, arr=[...lists[which].words]; const [rm]=arr.splice(i,1); lists[which]={words:arr}; queue("lists/"+which); quiz=null; renderWords();
    toast("Deleted “"+rm.w+"”", ()=>{ lists[which]={words:[...lists[which].words,rm]}; queue("lists/"+which); renderWords(); }); });
  drawQuiz();
}
function drawQuiz(){
  const q=document.getElementById("quiz"); if(!q) return; const ws=lists[wl].words, L=LIST[wl];
  if(!ws.length){ q.innerHTML=`<b>Quiz</b><div class="sub">Add a few words to start.</div>`; return; }
  if(!quiz){ q.innerHTML=`<b>Quiz</b> <span class="sub">${canSpeak?"listen → type → check":"read the clue → type the word"}</span><div style="margin-top:8px"><button class="btn primary" id="qs">Start quiz</button></div>`; q.querySelector("#qs").onclick=()=>{ quiz={i:pickWord(),ans:null}; drawQuiz(); }; return; }
  const w=ws[quiz.i]; if(!w){ quiz=null; drawQuiz(); return; }
  const clue = wl==="de" ? (w.h||"") : mask(w.h, w.w);
  q.innerHTML=`<b>Quiz</b> <span class="sub">${canSpeak?"listen and type what you hear":"type the word"}</span>
    <div class="prompt">${canSpeak?`<button class="btn" id="qsay">🔊 Say it again</button> `:""}${clue?`<span>${escT(clue)}</span>`:""}</div>
    <form id="qf" autocomplete="off"><input type="text" id="qa" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Your spelling" ${quiz.ans!==null?"disabled":""} value="${quiz.ans!==null?escT(quiz.ans):""}"></form>
    <div id="qr" style="margin-top:8px"></div>`;
  if(canSpeak) q.querySelector("#qsay").onclick=()=>speak(w.w,L.lang);
  const qr=q.querySelector("#qr");
  if(quiz.ans===null){
    if(canSpeak && !quiz.spoken){ quiz.spoken=true; speak(w.w,L.lang); }
    q.querySelector("#qa").focus();
    q.querySelector("#qf").onsubmit=e=>{ e.preventDefault(); const a=q.querySelector("#qa").value.trim(); if(!a) return; quiz.ans=a;
      const ok = a===w.w || (wl==="en" && a.toLowerCase()===w.w.toLowerCase());
      quiz.ok=ok; const arr=[...lists[wl].words]; arr[quiz.i]=Object.assign({},w,ok?{ok:(w.ok||0)+1}:{bad:(w.bad||0)+1}); lists[wl]={words:arr}; queue("lists/"+wl); drawQuiz(); };
  } else {
    qr.innerHTML = (quiz.ok?`<span class="res-ok">Correct ✓</span>`:`<span class="res-bad">Not quite ✗</span> — it's <b style="font-family:var(--mono)">${escT(w.w)}</b>. Write it 3× by hand.`)+
      ` <button class="btn primary" id="qn">Next word</button> <button class="btn" id="qx">Stop</button>`;
    qr.querySelector("#qn").onclick=()=>{ quiz={i:pickWord(),ans:null}; renderWords(); };
    qr.querySelector("#qx").onclick=()=>{ quiz=null; renderWords(); };
    qr.querySelector("#qn").focus();
  }
}

// ---------------- find
let findQ="";
function renderFind(){
  const el=document.getElementById("v-find");
  el.innerHTML=`<input type="search" id="fq" placeholder="Search the whole plan: DMA, Goethe, Project 2, Darmstadt…" value="${escT(findQ)}" style="width:100%" aria-label="Search the plan"><div class="hits" id="hits"></div>`;
  const inp=el.querySelector("#fq"); inp.oninput=()=>{ findQ=inp.value; drawHits(); }; drawHits(); inp.focus();
}
function drawHits(){
  const box=document.getElementById("hits"); const q=findQ.trim().toLowerCase();
  if(q.length<2){ box.innerHTML=`<div class="sub">Type at least 2 letters.</div>`; return; }
  const hits=[]; for(const day of DAYS) for(const t of day.t){ if((t.t+" "+(t.h||"")).toLowerCase().includes(q)) hits.push({d:day.d,t}); }
  const re=new RegExp("("+reEsc(escT(q))+")","ig");
  box.innerHTML = (hits.length?`<div class="sub">${hits.length} matches${hits.length>200?" · showing first 200":""}</div>`:`<div class="empty">No matches.</div>`)+
    hits.slice(0,200).map(x=>`<button class="hit" data-go="${x.d}" style="--kc:var(--k-${x.t.k})"><span class="d">${fmt(x.d,{day:"numeric",month:"short",year:"2-digit"})}${isDone(x.t)?" ✓":""}</span><span>${esc(x.t.t).replace(re,"<mark>$1</mark>")}</span></button>`).join("");
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{cur=b.dataset.go;switchView("today");});
}

// ---------------- wiring
const VIEWS={today:renderToday,week:renderWeek,month:renderMonth,stats:renderStatsView,phases:renderPhases,courses:renderCourses,words:renderWords,find:renderFind};
function render(){ renderStats(); VIEWS[view](); }
function switchView(v){
  view=v; document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v===v)));
  Object.keys(VIEWS).forEach(x=>document.getElementById("v-"+x).hidden = x!==v);
  try{ localStorage.setItem("rtg2028-view", v); }catch(e){}
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>switchView(b.dataset.v));
document.addEventListener("change", e=>{
  const c=e.target; if(c.matches('input[type=checkbox][data-id]')){ setStatus(TASK[c.dataset.id], c.checked?true:null); render(); }
});
document.addEventListener("click", e=>{
  const f=e.target.closest("[data-focus]"); if(f){ startTimer(TASK[f.dataset.focus]); return; }
  const s=e.target.closest("[data-skip]"); if(s){ const t=TASK[s.dataset.skip]; setStatus(t, status(t)==="s"?null:"s"); render(); }
});
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  if(view==="today"){ if(e.key==="ArrowLeft") go(-1); else if(e.key==="ArrowRight") go(1); else if(e.key==="t"||e.key==="T"){ cur=TODAY; render(); } }
  else if(view==="week"){ if(e.key==="ArrowLeft") go(-7); else if(e.key==="ArrowRight") go(7); }
});

loadLocal();
Object.keys(state).forEach(migrate);
try{ const v=localStorage.getItem("rtg2028-view"); if(v && VIEWS[v]) view=v; }catch(e){}
switchView(view);

// ---------------- connect the shared store: one subscription per collection
(async function(){
  const api = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!api){ mode="local"; showBanner("Ticks are saved in this browser only. Open this page from claude.ai while signed in to save them to your tracker."); renderStats(); return; }
  db = api; mode="db"; showBanner("");
  const offline = JSON.parse(JSON.stringify({months:state, weeks, lists}));
  const first = {months:true, weeks:true, lists:true};
  const refresh = ()=>{ saveLocal(); const a=document.activeElement; if((a && a.matches("textarea,input[type=text],input[type=search]")) || (view==="words" && quiz)) renderStats(); else render(); };
  const onErr = err=>showBanner("Live sync stopped ("+(err&&err.code)+"). Reload the page to reconnect; your changes are kept in this browser.");
  db.collection("months").onSnapshot(snap=>{
    snap.docs.forEach(doc=>{ const path="months/"+doc.id; if(pending.has(path)) return; const v=doc.data()||{}; state[doc.id]={done:Object.assign({}, v.done||{}), notes:Object.assign({}, v.notes||{})}; if(migrate(doc.id)) pending.add(path); });
    if(first.months){ first.months=false;
      for(const m of Object.keys(offline.months)){ const s=get(m), o=offline.months[m]; let ch=false;
        for(const k of Object.keys(o.done||{})){ if(!s.done[k]){ s.done[k]=o.done[k]; ch=true; } }
        for(const k of Object.keys(o.notes||{})){ if(!s.notes[k]){ s.notes[k]=o.notes[k]; ch=true; } }
        if(migrate(m)) ch=true; if(ch) pending.add("months/"+m); } }
    if(pending.size) flush(); refresh();
  }, onErr);
  db.collection("weeks").onSnapshot(snap=>{
    snap.docs.forEach(doc=>{ if(pending.has("weeks/"+doc.id)) return; weeks[doc.id]=Object.assign({}, doc.data()||{}); });
    if(first.weeks){ first.weeks=false; for(const w of Object.keys(offline.weeks)){ if(!weeks[w] || !Object.keys(weeks[w]).length){ weeks[w]=offline.weeks[w]; pending.add("weeks/"+w); } } if(pending.size) flush(); }
    refresh();
  }, onErr);
  db.collection("lists").onSnapshot(snap=>{
    snap.docs.forEach(doc=>{ if(pending.has("lists/"+doc.id)) return; const v=doc.data()||{}; lists[doc.id]={words:Array.isArray(v.words)?v.words.map(x=>Object.assign({},x)):[]}; });
    if(first.lists){ first.lists=false; for(const k of Object.keys(offline.lists)){ if(!lists[k]) lists[k]={words:[]}; const have=new Set(lists[k].words.map(x=>x.w.toLowerCase())); const add=(offline.lists[k].words||[]).filter(x=>!have.has(x.w.toLowerCase())); if(add.length){ lists[k]={words:[...lists[k].words,...add]}; pending.add("lists/"+k); } } if(pending.size) flush(); }
    refresh();
  }, onErr);
})();
})();
</script>
